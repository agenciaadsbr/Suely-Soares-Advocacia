<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Obrigada | Suely Soares Advocacia</title>
<meta name="theme-color" content="#0D0809">
<link rel="icon" href="assets/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700&display=swap">
<!-- META PIXEL: cole aqui o código-base do Pixel (fbq init + PageView) e, logo abaixo, fbq('track','Lead') — a conversão de lead do formulário é esta página -->
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 20px;font-family:Manrope,system-ui,sans-serif;color:#FFFFFF;background:#0D0809;position:relative;overflow:hidden}
.bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.shade{position:fixed;inset:0;background:radial-gradient(80% 70% at 50% 45%,rgba(114,62,71,.55),rgba(13,8,9,.92))}
.card{position:relative;z-index:1;width:100%;max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px;animation:up .8s cubic-bezier(.2,.8,.2,1) both}
.logo{width:120px;height:auto}
h1{margin:0;font-family:"Libre Caslon Text",Georgia,serif;font-weight:700;font-size:clamp(34px,7vw,52px);line-height:1.08;letter-spacing:-.015em}
h1 em{font-style:italic;font-weight:400;color:#FFD8DE}
p{margin:0;font-size:17px;line-height:1.65;color:#EBD9DC}
.count{width:84px;height:84px;border-radius:50%;border:1px solid rgba(255,216,222,.5);display:flex;align-items:center;justify-content:center;font-family:"Libre Caslon Text",serif;font-size:36px;color:#FFD8DE;position:relative}
.count::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:2px solid transparent;border-top-color:#FFD8DE;animation:spin 1s linear infinite}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 28px;border-radius:4px;text-decoration:none;font-weight:700;font-size:16px;background:#17803F;color:#FFFFFF;box-shadow:0 16px 32px -16px rgba(23,128,63,.75);transition:transform .3s,background-color .3s}
.btn:hover{background:#126B34;transform:translateY(-2px)}
.small{font-size:13px;color:#BFA9AE}
.small a{color:#FFD8DE}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
<img class="bg" src="assets/bg-bokeh.webp" alt="" width="1024" height="579">
<div class="shade" aria-hidden="true"></div>
<main class="card">
  <img class="logo" src="assets/logo-full-dark.png" alt="Suely Soares Advocacia e Consultoria Jurídica" width="120" height="120">
  <h1>Obrigada<span id="nome"></span>, <em>recebemos seu contato.</em></h1>
  <p>Você será redirecionado(a) automaticamente para o atendimento no WhatsApp.</p>
  <div class="count" aria-live="polite"><span id="n">3</span></div>
  <a id="wa" class="btn" href="https://wa.me/5583991766666" target="_top" rel="noopener">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.3A8.4 8.4 0 1 1 21 11.5z"></path><path d="M9 9.5c.3 1.9 2.6 4.3 4.6 4.6l1.2-1.1 2 1"></path></svg>
    Continuar no WhatsApp
  </a>
  <p class="small">Se o WhatsApp não abrir, toque no botão acima. <a href="/" target="_top">Voltar ao site</a></p>
</main>
<script src="config.js"></script>
<script>
(function () {
  var C = window.LP_CONFIG || {};
  var q = new URLSearchParams(location.search);
  var n = (q.get('n') || '').trim().slice(0, 40);
  if (n) document.getElementById('nome').textContent = ', ' + n;
  var stored = {};
  try { stored = JSON.parse(sessionStorage.getItem('ss_utm') || '{}'); } catch (e) {}
  ['utm_source', 'utm_term', 'utm_content'].forEach(function (k) { if (q.get(k)) stored[k] = q.get(k); });
  var ref = [stored.utm_source, stored.utm_term, stored.utm_content].filter(Boolean);
  var msg = 'Olá! ' + (n ? 'Meu nome é ' + n + '. ' : '') +
    'Acessei a página da Dra. Suely Soares e gostaria de obter orientação sobre uma questão relacionada ao meu direito de dirigir.' +
    (ref.length ? '\n\n(ref: ' + ref.join(' | ') + ')' : '');
  var WA = 'https://wa.me/' + (C.whatsapp || '5583991766666') + '?text=' + encodeURIComponent(msg);
  document.getElementById('wa').href = WA;
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push(Object.assign({ event: 'lead_thankyou' }, stored));
  var el = document.getElementById('n'), c = 3;
  function go() { try { window.top.location.href = WA; } catch (e) { window.location.href = WA; } }
  var t = setInterval(function () {
    c--;
    if (c <= 0) { clearInterval(t); el.textContent = '✓'; go(); return; }
    el.textContent = c;
  }, 1000);
})();
</script>
</body>
</html>
